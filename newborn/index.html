<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新生兒保單投保 5 大攻略｜保險實話 Talk</title>
<meta name="description" content="寶寶出生後什麼時候保？先天性疾病賠不賠？醫療、意外、爸媽自己的保障怎麼排順序？一篇看懂新生兒投保 5 大重點。">
<!-- 脆／LINE 貼連結時的預覽卡 -->
<meta property="og:type" content="article">
<meta property="og:title" content="新生兒保單投保 5 大攻略">
<meta property="og:description" content="什麼時候保、先天性疾病賠不賠、保障怎麼排順序，一篇看懂。">
<meta property="og:url" content="https://yuzisu.vercel.app/newborn/">
<meta property="og:image" content="https://yuzisu.vercel.app/newborn/img/01.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4ecdf;--card:#fffdf9;--ink:#2d2a26;--soft:#6b645b;--line:#e6dac8;--accent:#C8464B;--teal:#245A5E}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.7}
  a{color:inherit}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(244,236,223,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
  .brand{font-weight:700;font-size:17px;text-decoration:none}
  .to-card{margin-left:auto;font-size:15px;color:var(--accent);text-decoration:none;font-weight:700;border:1.5px solid var(--accent);border-radius:999px;padding:3px 14px}
  .wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:28px;padding-bottom:36px}
  @media(min-width:900px){.wrap{grid-template-columns:minmax(0,560px) 1fr;padding:28px 16px 40px}.side{display:block!important}.more-mobile{display:none}}
  .slides{display:flex;flex-direction:column;gap:10px}
  .slides img{display:block;width:100%;height:auto;aspect-ratio:1080/1350;background:#ebe0cf}
  @media(min-width:900px){.slides img{border-radius:14px;box-shadow:0 4px 18px rgba(120,90,50,.12)}}
  .cta{margin:24px 16px 0;padding:22px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
  .cta p{font-size:18px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
  .btn{text-decoration:none;font-weight:700;font-size:17px;border-radius:999px;padding:10px 22px}
  .btn.main{background:var(--accent);color:#fff}
  .btn.ghost{border:1.5px solid var(--accent);color:var(--accent)}
  @media(min-width:900px){.cta{margin:24px 0 0}}
  .more-mobile{margin:30px 0 0}
  .more-title{font-size:20px;font-weight:900;margin:0 16px 12px}
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .gcard{flex:0 0 70%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;display:block}
  .gcard .emoji{font-size:28px;line-height:1}
  .gcard .t{font-weight:700;font-size:18px;line-height:1.45;margin-top:8px}
  .gcard .d{font-size:15px;color:var(--soft);line-height:1.6;margin-top:4px}
  .gcard.soon{opacity:.55;pointer-events:none}
  .gcard.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .badge{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px;margin-top:8px}
  .badge.now{background:var(--accent);color:#fff}.badge.soon{background:var(--line);color:var(--soft)}
  .side{display:none}.side-in{position:sticky;top:84px}.side .more-title{margin:0 0 12px}.side .gcard{margin-bottom:12px}
  footer{text-align:center;padding:24px 16px 36px;color:var(--soft);font-size:14px;border-top:1px solid var(--line)}
  footer b{color:var(--teal);font-size:17px;letter-spacing:2px}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <div class="avatar">蘇</div>
  <a class="brand" href="https://yuzisu.vercel.app">保險實話 Talk</a>
  <a class="to-card" href="https://yuzisu.vercel.app">認識我</a>
</div></header>

<div class="wrap">
  <main>
    <h1 style="position:absolute;left:-9999px">新生兒保單投保 5 大攻略</h1>
    <div class="slides">
      <img src="img/01.jpg" alt="新生兒保單 5 大攻略：什麼時候保？先天性疾病賠不賠？保障要怎麼排順序？">
      <img src="img/02.jpg" alt="攻略1：出生登記完就能保，越早越好。0 歲投保，新生兒篩檢項目的相關疾病排除等待期。" loading="lazy">
      <img src="img/03.jpg" alt="攻略2：先天性疾病不是一律不賠，關鍵在投保前是否已經知道。健康告知要誠實填。" loading="lazy">
      <img src="img/04.jpg" alt="攻略3：醫療排第一，實支實付補自費項目，住院日額補爸媽請假。" loading="lazy">
      <img src="img/05.jpg" alt="攻略4：意外險重點在醫療和失能。未滿 15 歲身故只給付喪葬費用，上限 69 萬。" loading="lazy">
      <img src="img/06.jpg" alt="攻略5：爸媽先保好，才是給孩子最好的保障。" loading="lazy">
      <img src="img/07.jpg" alt="重點整理與聲明：本內容為一般保險知識分享，不構成任何商品推薦。" loading="lazy">
    </div>

    <div class="cta">
      <p>每個家庭的預算都不一樣，<br>看完還不確定怎麼安排，歡迎來聊聊。</p>
      <div class="btns">
        <a class="btn main" href="https://yuzisu.vercel.app">認識我、加 LINE</a>
        <a class="btn ghost" href="#" onclick="share();return false;">分享給新手爸媽</a>
      </div>
    </div>

    <section class="more-mobile">
      <div class="more-title">其他攻略</div>
      <div class="rail" id="rail"></div>
    </section>
  </main>

  <aside class="side"><div class="side-in">
    <div class="more-title">其他攻略</div>
    <div id="sideList"></div>
  </div></aside>
</div>

<footer><b>保險實話 Talk</b><br>把保險講成聽得懂的話</footer>

<script>
/* ====== 攻略清單：之後新增文章，只要在這裡加一行 ======
   status: "now" = 這篇、"live" = 已上線、"soon" = 準備中（不能點） */
const GUIDES = [
  {emoji:"👶", title:"新生兒保單投保 5 大攻略", desc:"什麼時候保、先天性疾病、保障順序", url:"/newborn/", status:"now"},
  {emoji:"🚗", title:"車險怎麼保才不會白花錢", desc:"強制險、第三人責任險一次看懂", url:"/car/", status:"soon"},
  {emoji:"🧾", title:"理賠申請不卡關", desc:"要準備哪些文件、常見退件原因", url:"/claims/", status:"soon"},
  {emoji:"🏥", title:"實支實付 vs 住院日額", desc:"兩種醫療險差在哪、怎麼搭配", url:"/medical/", status:"soon"},
];

function card(g){
  const tag = g.status==="now" ? '<span class="badge now">你正在看</span>'
            : g.status==="soon" ? '<span class="badge soon">準備中</span>' : '';
  return `<a class="gcard ${g.status}" href="${g.url}">
    <div class="emoji">${g.emoji}</div>
    <div class="t">${g.title}</div>
    <div class="d">${g.desc}</div>${tag}</a>`;
}
// 手機把「這篇」放最後，先看到別篇；電腦照順序
const others = GUIDES.filter(g=>g.status!=="now");
document.getElementById("rail").innerHTML = others.map(card).join("");
document.getElementById("sideList").innerHTML = GUIDES.map(card).join("");

function share(){
  const data={title:document.title,url:location.href};
  if(navigator.share){navigator.share(data).catch(()=>{});}
  else{navigator.clipboard.writeText(location.href).then(()=>alert("連結已複製"));}
}
</script>
</body>
</html>
